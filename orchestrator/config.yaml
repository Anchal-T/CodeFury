concurrency:
  max_workers: 3          # tune to your laptop's free RAM

budgets:
  # Per-level token caps enforced at dispatch; null disables a level's cap.
  # Phase 8 measured baseline (fake_worker attributes 1000/task): a full
  # two-domain epic burned 2k tokens, all at level 0 — levels 1-3 stay idle
  # until they make real LLM calls. Keep the defaults as headroom and tune
  # against YOUR burn via scripts/token_report.py after a real run.
  worker_tokens: 50000
  manager_tokens: 150000
  domain_lead_tokens: 300000
  architect_tokens: 500000

retries:
  max_worker_retries: 2
  max_manager_escalations: 1
  max_reconcile_attempts: 1  # Domain Lead reconciliation dispatches per conflict

critic:
  # Deterministic report critic (Phase 11): heuristics over each worker's
  # diff (test-file tampering, forbidden paths, churn sanity, BLOCKED.md
  # inconsistencies). Warnings ride on the Report; strict=true makes the
  # manager promote them to blockers, routing into retry-with-feedback.
  enabled: true
  strict: false
  max_changed_files: 20
  forbidden_globs: ['.env*', '*secret*', 'config.yaml']

execution:
  # Harness agnostic (Phase 9): `harness` picks the runner backend (cli is
  # the built-in adapter) and `worker_command` is its injectable argv.
  # Config here, or the WORKER_CMD env var (legacy ZCODE_CMD still works).
  # A "{prompt}" placeholder is substituted in place; without it the prompt
  # is appended as the last argument. Any prompt-taking agent CLI works:
  #   worker_command: [claude, -p, "{prompt}"]
  #   worker_command: [codex, exec, "{prompt}"]
  #   worker_command: [python, scripts/fake_worker.py]   # offline stand-in
  harness: cli
  worker_command: [zcode]
  # test_command defaults to [<running interpreter>, -m, pytest, -q] so it
  # works on both Linux and Windows; set it here only to override.
  worker_timeout_s: 1800

paths:
  workspaces: ./workspaces
  domains: ./domains
  db: ./data/orchestrator.db
  logs: ./logs
